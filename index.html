<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Banking Connect Rail Run: learn how Banking Connect works through short explainers and games.">
<meta name="theme-color" content="#0b1020">
<title>Banking Connect Rail Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#111338; --bg2:#171A47; --card:#1E2257; --card2:#282D6E; --line:#363C88; --ink:#F4F2FF; --muted:#A9A8D9;
  --gold:#FFD04D; --pay:#2FD6BA; --settle:#86A4FF; --mandate:#FFAE4A; --dispute:#FF6C80; --role:#C897FF; --boss:#FF8A3D;
  --good:#4BE393; --bad:#FF5A6E; --c:var(--gold);
  --goldt:var(--gold); --badt:#FFB3BC; --goodt:#B7F5D2; --hdr:rgba(17,19,56,.9); --hdr2:rgba(23,26,71,.97); --dot:rgba(255,255,255,.07);
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --navh:0px;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]):not(.rr-dark){color-scheme:light;--bg:#F3F4FB;--bg2:#E6E9F6;--card:#FFFFFF;--card2:#EEF0FA;--line:#D2D6EB;--ink:#1A1D45;--muted:#565A84;--gold:#F0B400;--goldt:#8A5D00;--pay:#0B9A83;--settle:#4466D6;--mandate:#C0730A;--dispute:#D43C55;--role:#8452D4;--boss:#CF5A14;--good:#1E9A5A;--bad:#D63048;--badt:#B3263A;--goodt:#156B3E;--hdr:rgba(243,244,251,.92);--hdr2:rgba(255,255,255,.97);--dot:rgba(26,29,69,.07);}}
:root[data-theme="light"]:not(.rr-dark){color-scheme:light;--bg:#F3F4FB;--bg2:#E6E9F6;--card:#FFFFFF;--card2:#EEF0FA;--line:#D2D6EB;--ink:#1A1D45;--muted:#565A84;--gold:#F0B400;--goldt:#8A5D00;--pay:#0B9A83;--settle:#4466D6;--mandate:#C0730A;--dispute:#D43C55;--role:#8452D4;--boss:#CF5A14;--good:#1E9A5A;--bad:#D63048;--badt:#B3263A;--goodt:#156B3E;--hdr:rgba(243,244,251,.92);--hdr2:rgba(255,255,255,.97);--dot:rgba(26,29,69,.07);}
:root.rr-light{color-scheme:light;--bg:#F3F4FB;--bg2:#E6E9F6;--card:#FFFFFF;--card2:#EEF0FA;--line:#D2D6EB;--ink:#1A1D45;--muted:#565A84;--gold:#F0B400;--goldt:#8A5D00;--pay:#0B9A83;--settle:#4466D6;--mandate:#C0730A;--dispute:#D43C55;--role:#8452D4;--boss:#CF5A14;--good:#1E9A5A;--bad:#D63048;--badt:#B3263A;--goodt:#156B3E;--hdr:rgba(243,244,251,.92);--hdr2:rgba(255,255,255,.97);--dot:rgba(26,29,69,.07);}
:root.rr-dark{color-scheme:dark}
svg.scene{--ink:#F4F2FF;--muted:#A9A8D9;--card:#1E2257;--card2:#282D6E;--line:#363C88;--bg:#111338;--bg2:#171A47;--gold:#FFD04D;--goldt:#FFD04D;--pay:#2FD6BA;--settle:#86A4FF;--mandate:#FFAE4A;--dispute:#FF6C80;--role:#C897FF;--boss:#FF8A3D;--good:#4BE393;--bad:#FF5A6E;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background-color:var(--bg);background-image:radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 0);background-size:22px 22px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 calc(40px + var(--navh));-webkit-tap-highlight-color:transparent}
.wrap{max-width:1100px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.02;letter-spacing:-.01em;margin:0;text-wrap:balance}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px}
.top .wrap{display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--display);font-weight:800;font-size:21px;white-space:nowrap}
.coin{width:26px;height:26px;border-radius:50%;background:var(--gold);color:#3A2A00;display:grid;place-items:center;font-size:14px;font-weight:800;font-family:var(--body);box-shadow:0 0 0 3px rgba(255,208,77,.25)}
.tabs{display:flex;gap:4px;margin-left:10px}
.tabs a{text-decoration:none;font-weight:600;font-size:15px;padding:8px 14px;border-radius:999px;color:var(--muted);display:flex;align-items:center;gap:7px}
.tabs a svg{width:18px;height:18px}
.tabs a[aria-current="page"]{background:var(--card2);color:var(--ink)}
.sp{flex:1}
.xp{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
.xp b{color:var(--goldt);font-size:15px}
.mode{display:flex;border:1.5px solid var(--line);border-radius:999px;padding:2px;flex:none}
.mode button{border:0;background:none;padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted);min-height:32px}
.mode button[aria-pressed="true"]{background:var(--gold);color:#2B1F00}

/* bottom nav (mobile) */
.bnav{display:none}
@media (max-width:760px){
  :root{--navh:calc(66px + env(safe-area-inset-bottom,0px))}
  .tabs,.xp{display:none}
  .brand{font-size:19px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--hdr2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav a{flex:1;text-decoration:none;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0;border-radius:12px;min-height:52px}
  .bnav a svg{width:22px;height:22px}
  .bnav a[aria-current="page"]{color:var(--goldt);background:var(--card)}
  body.playing .bnav{display:none}
  body.playing{--navh:0px}
}

/* view transitions */
#view{padding-top:18px}
.enter{animation:enter .32s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:.001;transform:translateY(12px)}to{opacity:1;transform:none}}

/* generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--gold);color:#2B1F00;border:0;border-radius:999px;padding:12px 22px;font-weight:800;font-size:16px;text-decoration:none;min-height:48px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.c{background:var(--c);color:#12143A}
.btn:disabled{opacity:.35;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;text-decoration:none;min-height:32px}
.chip.term{border-color:color-mix(in srgb,var(--gold) 45%,var(--line))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tl{background:none;border:0;padding:0;color:var(--goldt);font-weight:700;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;cursor:pointer;font-size:inherit}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.sec{margin-top:34px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-h h2{font-size:clamp(26px,5vw,34px)}
.sec-h p{margin:0;color:var(--muted);max-width:44ch}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;min-height:40px}

/* home */
.hero{display:grid;grid-template-columns:1fr 1.05fr;gap:28px;align-items:center}
.hero h1{font-size:clamp(46px,9vw,92px);letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--goldt)}
.hero .lede{font-size:18px;color:var(--muted);max-width:36ch;margin:14px 0 20px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rankbar{margin-top:18px;display:grid;gap:6px;max-width:380px}
.rankbar .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.rankbar .row b{color:var(--ink)}
.meter{height:10px;border-radius:99px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--boss));border-radius:99px}
.mapbox{background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:22px;padding:10px;position:relative}
.mapbox .cap{position:absolute;left:18px;bottom:12px;font-size:12px;color:var(--muted)}
svg.net{width:100%;height:auto;display:block;max-width:100%}
svg.net .nd circle.bg{fill:var(--card2);stroke:var(--line);stroke-width:2}
svg.net .nd text.ic{font-family:var(--display);font-weight:800;font-size:13px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
svg.net .nd text.lb{font-family:var(--body);font-weight:600;font-size:11px;fill:var(--muted);text-anchor:middle}
svg.net a.nd:hover circle.bg,svg.net a.nd:focus circle.bg{stroke:var(--gold)}
svg.net .hub circle.bg{fill:#fff;stroke:var(--gold);stroke-width:3}
svg.net .hub text.ic{fill:#2B1F00}
svg.net .rail{stroke:var(--line);stroke-width:3;fill:none}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.zone{--c:var(--gold);text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px;position:relative;overflow:hidden}
.zone::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.zone h3{font-size:22px}
.zone p{margin:0;color:var(--muted);font-size:14px}
.zone .st{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.stars{color:var(--goldt);letter-spacing:2px;font-size:15px}
.stars .off{color:var(--line)}

/* levels */
.zl{--c:var(--gold);margin-top:22px}
.zl-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.zl-h .dot{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}
.zl-h h2{font-size:24px}
.zl-h span{color:var(--muted);font-size:14px}
.lvrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;position:relative}
.lv{text-decoration:none;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;min-height:84px}
.lv:hover{border-color:var(--c)}
.lv .no{width:48px;height:48px;border-radius:50%;border:3px solid var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;background:var(--bg2)}
.lv.done .no{background:var(--c);color:#12143A}
.lv.locked{opacity:.5}
.lv.locked .no{border-color:var(--line)}
.lv b{display:block;font-size:16px;line-height:1.25}
.lv .ty{font-size:12px;color:var(--c);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.lv .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;font-size:13px;color:var(--muted)}

/* codex */
.search{width:100%;max-width:420px;background:var(--card);border:1.5px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;min-height:48px}
.search::placeholder{color:var(--muted)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:14px}
.ccard{text-decoration:none;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:6px;position:relative;min-height:112px}
.ccard:hover{border-color:var(--gold)}
.ccard b{font-size:16px;padding-right:26px}
.ccard p{margin:0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ccard .got{position:absolute;top:12px;right:12px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#2B1F00;display:grid;place-items:center;font-size:12px;font-weight:800}
.ccard.new{border-style:dashed;opacity:.72}
.ccard.new .got{background:transparent;border:1.5px dashed var(--muted);color:transparent}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.filters button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;min-height:36px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* detail pages */
.detail{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}
.detail h1{font-size:clamp(34px,6vw,54px)}
.detail .big{font-size:19px;line-height:1.55;max-width:60ch}
.detail .tech{font-size:15px;color:var(--muted);border-left:3px solid var(--gold);padding-left:12px;max-width:62ch}
.detail .tech code,.fb code,.prompt code{font-family:var(--mono);font-size:.88em;background:var(--bg2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--ink)}
.side{display:grid;gap:14px}
.side h3{font-size:15px;font-family:var(--body);font-weight:700;margin-bottom:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.src{font-size:13px;color:var(--muted)}
.src b{color:var(--ink);font-weight:600}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.lvlink{display:flex;align-items:center;gap:10px;text-decoration:none;padding:10px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-weight:600;font-size:14px;min-height:48px}
.lvlink i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.lvlist{display:grid;gap:8px}

/* profile */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-family:var(--display);font-size:32px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.badge{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:4px;text-align:center;justify-items:center}
.badge .medal{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;background:var(--bg2);border:3px dashed var(--line);color:var(--muted)}
.badge.on .medal{background:var(--c);border:3px solid color-mix(in srgb,var(--c) 50%,white);color:#12143A}
.badge b{font-size:14px}.badge span{font-size:12px;color:var(--muted)}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* game */
.hud{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center}
.hud .x{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;text-decoration:none;font-size:18px}
.hud .nm{min-width:0}
.hud .nm b{display:block;font-family:var(--display);font-size:clamp(18px,3.4vw,24px);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .nm .eyebrow{color:var(--c)}
.hearts{display:flex;gap:3px}
.hearts svg{width:22px;height:22px}
.hearts .lost{opacity:.18;transform:scale(.8)}
.hearts .hit{animation:hit .5s}
@keyframes hit{0%{transform:scale(1.4)}100%{transform:scale(.8)}}
.score{font-family:var(--mono);font-weight:600;font-size:14px;text-align:right;min-width:74px}
.score b{display:block;font-size:22px;color:var(--goldt);line-height:1;font-variant-numeric:tabular-nums}
.score .mult{font-size:11px;color:var(--boss)}
.prog{height:6px;background:var(--bg2);border-radius:99px;margin-top:12px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .4s}
.tbar{height:4px;margin-top:6px;background:transparent;border-radius:99px;overflow:hidden}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--gold) 35%,var(--good));transform-origin:left;transform:scaleX(0)}
.stage{margin-top:16px;position:relative}
.shake{animation:shake .38s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 76px);transform:translate(-50%,-10px);z-index:40;background:var(--good);color:#06291A;font-weight:800;padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.toast.bad{background:var(--bad);color:#fff}
.toast.on{opacity:1;transform:translate(-50%,0)}
.prompt{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.prompt .eyebrow{color:var(--c)}
.prompt p{margin:6px 0 0;font-size:18px;line-height:1.45}
.prompt .hint{margin-top:8px;font-size:13px;color:var(--muted)}

/* route rush */
.rr{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.rr .board{background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:6px}
.rr-side{display:grid;gap:12px}
svg.net g.nd{cursor:pointer;outline:none}
svg.net g.nd:focus-visible circle.bg{stroke:var(--gold);stroke-width:4}
svg.net a.nd{outline:none}
svg.net g.nd:hover circle.bg{stroke:var(--c)}
svg.net g.nd.at circle.bg{stroke:var(--c);stroke-width:4}
svg.net g.nd.bad circle.bg{stroke:var(--bad);stroke-width:4}
svg.net g.nd.ok circle.bg{stroke:var(--good);stroke-width:4}
svg.net .trail{stroke:var(--c);stroke-width:5;stroke-linecap:round;fill:none;opacity:.9}
svg.net .apitag rect{fill:var(--bg);stroke:var(--c);stroke-width:1.5}
svg.net .apitag text{font-family:var(--mono);font-size:10px;font-weight:600;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.pulse{animation:pulse 1.4s infinite}
@keyframes pulse{0%{r:26}50%{r:31}100%{r:26}}
.log{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;max-height:320px;overflow:auto}
.log ol{margin:8px 0 0;padding-left:22px;display:grid;gap:6px;font-size:14px}
.log li b{font-family:var(--mono);font-size:13px;color:var(--c)}
.log li span{color:var(--muted)}
.log .empty{color:var(--muted);font-size:14px;margin:8px 0 0}

/* sequence */
.seq{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.slots{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:8px;counter-reset:s}
.slot{border:1.5px dashed var(--line);border-radius:12px;min-height:50px;padding:8px 12px 8px 44px;position:relative;display:grid;align-content:center;font-size:14px;color:var(--muted)}
.slot::before{counter-increment:s;content:counter(s);position:absolute;left:10px;top:50%;margin-top:-13px;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:13px}
.slot.fill{border-style:solid;border-color:var(--c);background:var(--bg2);color:var(--ink);animation:enter .3s}
.slot.fill::before{background:var(--c);border-color:var(--c);color:#12143A}
.slot small,.sc small{display:block;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.deck{display:grid;gap:8px}

/* ===== Easter egg (.hjp) ===== */
html.egg-glitch body{animation:eggShake .09s steps(2) infinite,eggFlick .5s steps(3) infinite}
@keyframes eggShake{0%{transform:translate(0,0) skewX(0)}25%{transform:translate(-9px,4px) skewX(4deg)}50%{transform:translate(7px,-6px) skewX(-3deg)}75%{transform:translate(-4px,-3px) skewX(2deg)}100%{transform:translate(5px,6px) skewX(-5deg)}}
@keyframes eggFlick{0%{filter:none}33%{filter:invert(1) hue-rotate(90deg) contrast(1.6)}66%{filter:hue-rotate(220deg) saturate(3)}100%{filter:none}}
html.egg-lock,html.egg-lock body{overflow:hidden!important;overscroll-behavior:none}
#egg{position:fixed;inset:0;z-index:99999;background:#05071a;color:#E9ECFF;font-family:"JetBrains Mono",ui-monospace,monospace;touch-action:none;user-select:none;-webkit-user-select:none;animation:eggIn .45s ease-out}

#egg canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#egg:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.egg-hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:14px;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;font-size:12px;letter-spacing:.08em;z-index:2;flex-wrap:wrap}

.egg-hud button:hover{background:rgba(255,255,255,.16)}

.egg-ctl input:focus-visible::-webkit-slider-thumb{outline:3px solid #fff;outline-offset:2px}
.egg-hint{text-align:center;font-size:11px;letter-spacing:.1em;opacity:.65}

  E("pa","ibmb","Ravi banks with a small co-operative bank that the payment partner has never connected to. Where does the request go so it can still reach that bank?","Banking Connect. One connection to it reaches every bank on the network, big or small.","Think about who has already connected to every bank."),
  E("ibmb","issuer","Who asks Ravi to log in and approve the ₹1,250?","His own bank. Only his bank knows his login; nobody else in the chain sees it.","Only one player holds Ravi's account."),
  E("issuer","ibmb","Ravi's bank has taken the ₹1,250. Before anyone is told 'success', who has to hear about it?","Banking Connect, which runs its safety checks and confirms the payment.","The checks happen in the middle of the network."),
  E("ibmb","pa","Checks passed. Who is told next, so the power company can mark the bill as paid?","The payment partner, which passes the confirmation on to the power company.","Not the company directly: the go-between it works with.")]},
 {intro:"Meera buys a ₹38,000 laptop online and approves it in her bank app. But something about this payment looks risky.",steps:[
  E("customer","merchant","Meera places her order and picks net banking. Whose checkout is she on?","The electronics store's, the shop (merchant) selling the laptop.","Who is selling the laptop?"),
  E("merchant","pa","Which player does the store rely on to collect the money?","Its payment partner.","The store doesn't deal with banks itself."),
  E("pa","ibmb","The partner needs a sealed, signed payment link so nobody can change the amount. Who issues it?","Banking Connect. It seals the link so the ₹38,000 can't be changed on the way.","Only the network in the middle can seal it."),
  E("ibmb","issuer","Meera scans the QR code on screen. Where does she see the ₹38,000 and approve it?","In her own bank's app.","Where does she already log in to her account?"),
  E("issuer","ibmb","Her bank takes the money and reports it. Who works out the fraud score?","Banking Connect, as part of the checks it runs on every payment.","Every payment is checked in the same place."),
  E("ibmb","issuer","The fraud score is above the level NBBL sets, so the payment is stopped. Who must be told so Meera gets her money back?","Her bank, which returns the ₹38,000.","Who took the money out of her account?"),
  E("issuer","customer","Where does the ₹38,000 end up?","Back in Meera's account. A stopped payment doesn't lose her any money.","Whose money was it?")]},
 {intro:"Kabir renews his ₹2,400 insurance policy. His bank replies slowly, so his screen says 'pending'.",steps:[
  E("customer","merchant","Kabir chooses net banking on the insurer's website. Who has his renewal order?","The insurer, the shop (merchant) in this story.","Who is he buying from?"),
  E("merchant","pa","The insurer hands the payment to…","Its payment partner.","Its payment go-between."),
  E("pa","ibmb","…which sends it where, so Kabir's bank can be reached?","To Banking Connect, which reaches every participating bank.","The shared network."),
  E("ibmb","issuer","Where does Kabir approve the ₹2,400?","In his own bank's app or website.","Whose app does he trust with his money?"),
  E("issuer","ibmb","His bank is slow to reply and the screen says 'pending'. When the bank's final answer comes, where does it go?","To Banking Connect. 'Pending' just means it's still being confirmed; the money isn't lost.","The network that confirms every payment."),
  E("ibmb","pa","Banking Connect now has the final status. Who hears it next?","The payment partner.","Who is waiting on behalf of the insurer?"),
  E("pa","merchant","Who finally switches Kabir's policy from 'pending' to 'paid'?","The insurer, once its payment partner confirms.","Who sold him the policy?")]}

QB.story.push(
 Q("A small co-operative bank joins Banking Connect. Which payment partners can now reach its customers?",["All partners already connected to the network","Right. One connection reaches every bank on it."],["Only partners that sign a new deal with that bank","That was the old tangle, before Banking Connect."],["None, until RBI approves each partner","No extra approval per partner is needed."],"Interoperability: a single integration point for banks and payment aggregators.","TSD v1.6 §1",["ibmb","pa"]),
 Q("A ₹900 payment has a fraud score above NBBL's stop level. What happens?",["It's stopped and the bank returns the money","Right. Small doesn't mean safe."],["It goes through because the amount is small","The score decides, not the size."],["The shop decides whether to accept it","The network's checks decide."],"eFRM: if the risk score crosses the threshold, the transaction is declined and the debit reversed.","TSD v1.6 §4.3",["efrm"]),
 Q("Where does a customer type their net banking password?",["Only in their own bank's app or website","Right. Nobody else in the chain sees it."],["On the shop's checkout page","The shop never sees bank logins."],["In a Banking Connect app","There is no separate app; customers use their own bank."],"Customer authentication happens on the issuer's channel.","TSD v1.6 §6.1",["issuer"]),
 Q("Why does the payment partner get a 'sealed, signed' payment link?",["So nobody can change the amount on the way","Right. Only Banking Connect can open it."],["So the payment goes faster","It's about safety, not speed."],["So the customer doesn't have to approve","The customer always approves in their bank."],"The payment link is signed so the details can't be tampered with in transit.","TSD v1.6 §4.2, §6.1",["modes"]),
 Q("Before an auto-pay (like a SIP) takes money, what does the customer get?",["A heads-up at least 48 hours before","Right. No surprise debits."],["Nothing, it just happens","A reminder always comes first."],["A message after the money is gone","The warning comes before, not after."],"Pre-debit notification is sent at least 48 hours before each recurring debit.","Mandates & Lien TSD §6",["pdn","mandate"]),
 Q("A shop tries to refund an order that was already refunded. What stops the second refund?",["The back office's checks before any money moves","Right. It checks the payment hasn't already been refunded."],["The customer has to report it","The system catches it first."],["Nothing, it goes through","Double refunds are blocked."],"Before a refund, the back office validates the original transaction and prior refunds/disputes.","TSD v1.6 §12.2.1",["refund"])
);

const shareBtn=(l,txt)=>`<button class="share" type="button" data-share="${tokenFor(l)}">${LINKI}<span>${txt||"Copy link"}</span></button>`;
function copyLink(tok){const u=BASE+"#"+tok;const ok=()=>toast("Link copied. Paste it to open this chapter directly.",true);const fail=()=>linkSheet(u);try{navigator.clipboard.writeText(u).then(ok,fail)}catch(e){fail()}}
function linkSheet(u){closeSheet();const s=document.createElement("div");s.className="scrim";s.id="scrim";s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Share link"><button class="x" id="sx" aria-label="Close">✕</button><div class="grab"></div><h2>Share this link</h2><p style="margin:0;color:var(--muted)">Copy it and send it to anyone who has access to this game.</p><input class="search" id="lk" readonly value="${u}" style="max-width:none;font-family:var(--mono);font-size:13px"></div>`;document.body.appendChild(s);s.addEventListener("click",e=>{if(e.target===s||e.target.id==="sx")closeSheet()});const i=s.querySelector("#lk");i.focus();i.select()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-share]");if(b){e.preventDefault();e.stopPropagation();copyLink(b.dataset.share)}},true);

const LEARN={
 intro:{title:"What is Banking Connect?",blurb:"The one-minute basics: the problem, the fix and who's involved.",slides:[
  Sl("Paying online with net banking","When you pay a shop online with net banking, you approve the payment in your own bank's app or website, and the money comes straight from your bank account.",sceneC1),
  Sl("The old way was a tangle","Every payment company had to build its own link with every bank. Setting up took time, each bank settled on its own timetable, and there was no common way to sort out complaints.",LS.tangle,"TSD v1.6 §1"),
  Sl("The fix: one shared network","Banking Connect, run by NPCI Bharat BillPay (NBBL) with RBI approval, sits in the middle. Banks and payment companies connect to it once and can reach everyone else.",LS.hub,"TSD v1.6 §1"),
  Sl("Who's who","You'll meet six players: the customer, the shop, the shop's payment partner, Banking Connect, the banks, and RBI, which moves money between banks.",LS.who),
  Sl("What it promises","It works with any participating bank, handles payments of any size, checks every payment for fraud, settles on a standard timetable, and gives everyone one clear way to fix problems.",LS.promises,"TSD v1.6 §1 design principles")]},
 c1:{title:"How a payment works",blurb:"Three ways to pay, a sealed link, and who hears the result.",slides:[
  Sl("Three ways to reach your bank","At checkout you can open your bank app on the same phone, scan a QR code with your bank app, or log in on your bank's website.",LS.ways,"TSD v1.6 §4.2"),
  Sl("A sealed payment link","The shop's payment partner asks Banking Connect for a sealed, signed payment link. Only Banking Connect can open it, so nobody can change the amount on the way.",LS.sealed,"TSD v1.6 §4.2, §6.1"),
  Sl("You approve in your own bank","Your bank opens the link through Banking Connect, shows you exactly who you're paying and how much, and you approve the way you always do.",LS.approve,"TSD v1.6 §6.1"),
  Sl("Everyone hears the result","Banking Connect confirms the payment to your bank and tells the payment partner, which tells the shop to pack your order.",LS.hears,"TSD v1.6 §4.3")]},
 c2:{title:"How payments are kept safe",blurb:"Fraud score, the bank's limit, the right account, and why big is fine.",slides:[
  Sl("Checked in a split second","Every payment passes through Banking Connect's safety checks before it's confirmed. It happens so fast you won't notice.",LS.gate,"TSD v1.6 §4.3"),
  Sl("A fraud score","Each payment gets a fraud score. If it's above the limit NBBL sets, the payment is stopped and your bank returns the money.",LS.meter,"TSD v1.6 §4.3 steps 3–4"),
  Sl("The bank's limit","Each bank has a cap on how much it can owe the network before banks settle up, called the Net Debit Cap. A payment that would cross it is stopped.",LS.limit,"TSD v1.6 §4.3 step 2"),
  Sl("The right account","For some payments, like buying shares, the money must come from one verified account. If it comes from a different account, it's refused and refunded.",LS.account,"TSD v1.6 §8"),
  Sl("Big isn't bad","The network puts no upper limit on payment size, so it works for taxes and tenders too. Each bank can still set its own limits.",LS.bigok,"TSD v1.6 §1 (d)")]},
 c3:{title:"How the shop gets paid",blurb:"Batches, one summary, RBI, and the last mile to the shop.",slides:[
  Sl("Paid now, settled later","Your bank takes the money as soon as you approve. Moving it between banks happens a little later, in batches.",LS.waiting,"Settlement SOP"),
  Sl("One summary per batch","When a batch closes, Banking Connect adds up every payment into one instruction that says what each bank owes or is owed.",LS.summary,"Settlement SOP §Clearing and Settlement"),
  Sl("RBI moves the money","RBI, the central bank, takes the money from your bank's account and passes it to the payment partner's bank.",sceneC3,"Settlement SOP §Clearing and Settlement"),
  Sl("The last mile","The partner's bank moves the money into the payment partner's protected account, and the payment partner pays the shop.",LS.lastmile,"Settlement SOP §Clearing and Settlement"),
  Sl("Everyone gets a report","Within about an hour of each batch, banks and payment partners get reports listing every payment, so they can check their books match.",LS.reports,"Settlement SOP §Settlement Files")]},
 c5:{title:"Auto-pay and money on hold",blurb:"Mandates, reminders, numbered payments and liens.",slides:[
  Sl("Say yes once","A mandate is your permission for future payments: who can collect, how much, how often and until when. You approve it once in your bank app.",LS.yesOnce,"Mandates & Lien TSD §1, §6.1"),
  Sl("A reminder first","Before each regular automatic payment, a heads-up is sent at least 48 hours ahead.",LS.remind,"Mandates & Lien TSD §6 (PDN)"),
  Sl("Collected on the due date","On the due date the money is collected. Each payment is numbered 1, 2, 3 so none is skipped or taken twice.",LS.dueDate,"Mandates & Lien TSD §6.2, §9"),
  Sl("Money on hold","A lien keeps money in your account but locks it, for example for an IPO bid. If you get fewer shares, the rest is unlocked. Cancelling it unlocks everything.",LS.hold,"Mandates & Lien TSD §1, §6.3.1"),
  Sl("You're in control","You can cancel most auto-pays from your bank app. Loan EMIs are the exception: you stop those through the lender.",LS.control,"Mandates & Lien TSD §6.3.1, §9")]},
 c6:{title:"Getting money back",blurb:"Refunds, checks, reference numbers and the complaint ladder.",slides:[

function wrapName(n,max=17){const w=n.split(" "),out=[""];w.forEach(x=>{const c=out[out.length-1];if(c&&(c+" "+x).length>max)out.push(x);else out[out.length-1]=c?c+" "+x:x});return out}

   ${isCur?`<g class="mp-pin" transform="translate(${x} ${y-r-16})"><rect x="-44" y="-15" width="88" height="22" rx="11"/><text y="0">You are here</text></g>`:""}
   ${!s.hq&&s.vis!=="tease"?`<text x="${x}" y="${ly-4}" text-anchor="middle" class="mp-num">STOP ${i}</text>`:s.hq?`<text x="${x}" y="${ly-4}" text-anchor="middle" class="mp-num">START</text>`:""}

  nodes+=s.vis==="tease"?`<g class="${cls}" data-tease="${i}" tabindex="0" role="button" aria-label="Next stop, not revealed yet">${inner}</g>`:`<a class="${cls}" href="${s.href}" aria-label="${esc(s.n)}${isCur?", you are here":""}">${inner}</a>`});
 const fx=stops.findIndex(s=>s.vis==="fog");
 const fogG=fx>0?`<g class="mp-fog">${[0,1,2,3,4].map(k=>`<ellipse cx="${xs(fx)+60+(k%2)*50}" cy="${50+k*72}" rx="${90+(k%3)*18}" ry="70"/>`).join("")}<rect x="${xs(fx)+100}" y="0" width="${W}" height="${H}"/></g><text x="${xs(fx)+70}" y="${H/2-4}" class="mp-fogt">${fog} more stop${fog>1?"s":""}</text><text x="${xs(fx)+70}" y="${H/2+18}" class="mp-fogs">appear as you explore</text>`:"";
 const cs=stops[cur];
 return `<section class="mp-head land"><div class="mh-l"><div class="eyebrow">Your map</div><h1 class="h1e">${doneN===total?"You've explored everything!":doneN?"Keep exploring":"Start exploring"}</h1>

  <div class="mh-r"><div class="mp-prog"><div class="meter"><i style="width:${Math.round(doneN/total*100)}%"></i></div><span>${doneN} of ${total} stops explored</span></div>
   <div class="cta">${cs?`<a class="btn" href="${cs.href}">${cur===0?"Start":"Continue"}: ${esc(cs.n)} →</a>`:`<a class="btn" href="#me">See your badges</a>`}<a class="btn ghost" href="#product">What is Banking Connect?</a></div></div></section>

const hex=buf=>[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
async function pbkdf2(pw,salt){const e=new TextEncoder();const k=await crypto.subtle.importKey("raw",e.encode(pw),"PBKDF2",false,["deriveBits"]);return hex(await crypto.subtle.deriveBits({name:"PBKDF2",salt:e.encode(salt),iterations:150000,hash:"SHA-256"},k,256))}
async function sha(s){return hex(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))}
const rndSalt=()=>hex(crypto.getRandomValues(new Uint8Array(16)));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ===== Storage adapter: claude.ai store -> Firebase Firestore (if configured) -> this browser only ===== */
function localDB(){const K="rr3_db",subs=new Set();
 const rd=()=>{try{return JSON.parse(localStorage.getItem(K)||"{}")}catch(e){return{}}};
 const wr=o=>{localStorage.setItem(K,JSON.stringify(o));fire()};
 const snapDoc=(p,o)=>({id:p.split("/").pop(),exists:!!o[p],data:()=>o[p]?JSON.parse(JSON.stringify(o[p])):undefined});
 const merge=(a,b)=>{for(const k in b){const v=b[k];a[k]=(v&&typeof v==="object"&&!Array.isArray(v)&&a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k]))?merge(a[k],v):v}return a};
 function fire(){const o=rd();subs.forEach(f=>{try{f(o)}catch(e){}})}
 window.addEventListener("storage",e=>{if(e.key===K)fire()});
 return{local:true,
  doc(p){return{get:async()=>snapDoc(p,rd()),
   set:async d=>{const o=rd();o[p]=JSON.parse(JSON.stringify(d));wr(o)},
   update:async d=>{const o=rd();if(!o[p])throw new Error("not-found");merge(o[p],JSON.parse(JSON.stringify(d)));wr(o)},
   onSnapshot(cb){const f=o=>cb(snapDoc(p,o));subs.add(f);setTimeout(()=>f(rd()),0);return()=>subs.delete(f)}}},
  collection(c){const pre=c+"/";const q=o=>({docs:Object.keys(o).filter(k=>k.startsWith(pre)&&!k.slice(pre.length).includes("/")).map(k=>snapDoc(k,o))});
   return{get:async()=>q(rd()),onSnapshot(cb){const f=o=>cb(q(o));subs.add(f);setTimeout(()=>f(rd()),0);return()=>subs.delete(f)}}}}}
function loadJS(u){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
const ADMIN_FB_EMAIL="hardik.jp@bc-rail-run.web.app"; /* must match isAdmin() in the Firestore rules */
async function fireDB(){const v="10.12.2",b="https://www.gstatic.com/firebasejs/"+v+"/";
 await loadJS(b+"firebase-app-compat.js");await Promise.all([loadJS(b+"firebase-firestore-compat.js"),loadJS(b+"firebase-auth-compat.js")]);
 if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);const fs=firebase.firestore(),au=firebase.auth();
 await new Promise(ok=>{const u=au.onAuthStateChanged(()=>{u();ok()})});
 const wrapSnap=s=>({id:s.id,exists:s.exists,data:()=>s.data()});
 return{fb:true,
  isAdmin:()=>!!(au.currentUser&&au.currentUser.email===ADMIN_FB_EMAIL),
  async adminSignIn(pw){
   try{await au.signInWithEmailAndPassword(ADMIN_FB_EMAIL,pw);return true}catch(e){
    if(e&&(e.code==="auth/user-not-found"||e.code==="auth/invalid-credential"||e.code==="auth/invalid-login-credentials")){
     try{await au.createUserWithEmailAndPassword(ADMIN_FB_EMAIL,pw);return true}catch(e2){
      if(e2&&e2.code==="auth/email-already-in-use")return"This password doesn't match the admin password registered in Firebase.";
      return"Couldn't connect the admin account ("+(e2&&e2.code||"error")+")."}}
    if(e&&e.code==="auth/too-many-requests")return"Too many attempts. Wait a few minutes and try again.";
    if(e&&e.code==="auth/network-request-failed")return"No connection. Check your network and try again.";
    return"Couldn't sign in to Firebase ("+(e&&e.code||"error")+")."}},
  adminSignOut:()=>au.signOut().catch(()=>{}),
  doc(p){const r=fs.doc(p);return{get:async()=>wrapSnap(await r.get()),set:d=>r.set(d),update:d=>r.update(d),onSnapshot:(cb,er)=>r.onSnapshot(s=>cb(wrapSnap(s)),er)}},
  collection(c){const r=fs.collection(c);return{get:async()=>({docs:(await r.get()).docs.map(wrapSnap)}),onSnapshot:(cb,er)=>r.onSnapshot(s=>cb({docs:s.docs.map(wrapSnap)}),er)}}}}
const DBP=(async()=>{
 try{if(window.claude&&window.claude.use)return await window.claude.use("db")}catch(e){}
 try{if(FIREBASE_CONFIG&&FIREBASE_CONFIG.projectId)return await fireDB()}catch(e){console.warn("Firebase unavailable, using this browser's storage",e)}
 try{localStorage.setItem("rr3_probe","1");localStorage.removeItem("rr3_probe");return localDB()}catch(e){return null}})();

 function boom(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=60+Math.random()*260;S.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.5,c:col,r:1.5+Math.random()*2.5})}}

 function update(dt){S.t+=dt;

  const kd=(keys.ArrowLeft||keys.a?-1:0)+(keys.ArrowRight||keys.d?1:0);if(kd){S.tx=Math.min(W-pad(),Math.max(pad(),S.tx+kd*520*dt));syncR()}

 function updCatcher(dt){const Y=shipY(),reach=S.surge>0?64:38;
  S.spawnT-=dt;if(S.spawnT<=0){S.spawnT=Math.max(.24,.85-S.wave*.07)*(.6+Math.random()*.8);const r=Math.random(),k=r<Math.min(.14+S.wave*.03,.38)?"b":r>.94?"g":"c";S.items.push({x:pad()+Math.random()*(W-2*pad()),y:(($(".egg-hud").offsetHeight)||60)+4,vy:130+S.wave*24+Math.random()*70,k,rot:Math.random()*6})}

 function updBreaker(dt){const g=S.grid,b=S.ball,Y=shipY(),r=8,top=(($(".egg-hud").offsetHeight)||60)+4;

   cx.strokeStyle="#FFC93C";cx.lineWidth=3;cx.stroke();if(img.complete&&img.naturalWidth){const h=38,w=h*img.naturalWidth/img.naturalHeight;cx.drawImage(img,x-w/2,y-h/2,w,h)}}
